name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    name: Rust version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a higher Cargo version for Rust changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            echo 'No previous commit on main to compare.'
            exit 0
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          python3 .github/scripts/check-version.py "$BASE_SHA" "$HEAD_SHA"

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Tests use synthetic fixtures only; no live credentials are required.
      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo rustc --release --locked --target-dir target\installer-build --bin ai-allowance -- -C target-feature=+crt-static

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build per-user installer
        run: .\installer\build.ps1 -MakeNsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"

      - name: Test installer with isolated current-user keys
        run: .\installer\test.ps1 -MakeNsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ai-allowance-windows-x64-installer
          path: target/installer/ai-allowance-windows-x64-setup.exe
          if-no-files-found: error
