name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    name: Publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify the tag matches the Cargo package version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'aiallowance').version
          if ("v$version" -cne $env:GITHUB_REF_NAME) {
            throw "Release tag $env:GITHUB_REF_NAME must match Cargo package version v$version."
          }

      - name: Build release executable
        run: cargo rustc --release --locked --target-dir target\installer-build --bin ai-allowance -- -C target-feature=+crt-static

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Build per-user installer
        run: .\installer\build.ps1 -MakeNsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"

      - name: Publish release with installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            'target\installer\ai-allowance-windows-x64-setup.exe' `
            --verify-tag --generate-notes
