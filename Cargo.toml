[package]
name = "aiallowance"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "AI subscription usage and reset times in the Windows system tray"
repository = "https://github.com/avensolutions/ai-allowance"

[[bin]]
name = "ai-allowance"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
tao = "0.34"
tray-icon = "0.21"
# COM bindings for the native Explorer file and folder picker.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
