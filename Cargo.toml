[package]
name = "aiallowance"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AI subscription usage and reset times in the Windows system tray"
repository = "https://github.com/avensolutions/ai-allowance"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
toml = "0.9"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
notify-rust = "4"
reqwest = { version = "0.12", features = ["json"] }
tao = "0.34"
tray-icon = "0.21"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
